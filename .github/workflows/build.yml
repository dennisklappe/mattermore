# Builds what a release would build, on every pull request.
#
# Two releases shipped broken because compilation only happened on a tag: a
# patch that did not compile, and a default that never applied. Both would have
# failed here, before merge, which is the point.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    name: no Claude attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits and PR text carry no Claude co-author or attribution
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic)|generated with.*claude'
          fail=0
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "::error::The PR title or body has a Claude co-author trailer or attribution."
            fail=1
          fi
          for c in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if git log -1 --format=%B "$c" | grep -Eiq "$pattern"; then
              echo "::error::Commit $c has a Claude co-author trailer or attribution."
              fail=1
            fi
          done
          exit "$fail"

  patches:
    name: patches apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: upstream
        run: grep -E '^[A-Z_]+=' upstream.env >> "$GITHUB_OUTPUT"

      - name: Server patches apply to the pinned tag
        run: |
          git clone --quiet --depth 1 --branch "${{ steps.upstream.outputs.SERVER_TAG }}" \
            --filter=blob:none https://github.com/mattermost/mattermost.git /tmp/server
          for p in patches/server/*.patch; do
            git -C /tmp/server apply "$PWD/$p" || { echo "::error::$p does not apply"; exit 1; }
            echo "applied $(basename "$p")"
          done

      - name: Calls patches apply to the pinned tag
        run: |
          git clone --quiet --depth 1 --branch "${{ steps.upstream.outputs.CALLS_TAG }}" \
            https://github.com/mattermost/mattermost-plugin-calls.git /tmp/calls
          for p in patches/calls/*.patch; do
            git -C /tmp/calls apply "$PWD/$p" || { echo "::error::$p does not apply"; exit 1; }
            echo "applied $(basename "$p")"
          done

  plugin:
    name: calls plugin compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: ./scripts/build-calls.sh dist

  server:
    name: server compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Build the server binary
        # The web app is four minutes and is not what breaks: a release builds
        # it, this proves the Go side and the patch series compile.
        env:
          SKIP_WEBAPP: '1'
        run: ./scripts/build-server.sh /tmp/mattermore-server

  e2e:
    name: image runs, user limit lifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - name: Build the image
        env:
          CONTAINER_ENGINE: docker
        run: ./scripts/build-image.sh mattermore:ci
      - name: Run it and create more than 250 users
        run: ./scripts/e2e.sh mattermore:ci
